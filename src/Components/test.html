<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Torchlight Effect</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: url('https://picsum.photos/1200/800') no-repeat center center/cover;
      font-family: sans-serif;
    }

    .mask-layer {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.98);
      mask-image: radial-gradient(circle 100px at 0 0, transparent 0%, black 100%);
      -webkit-mask-image: radial-gradient(circle 100px at 0 0, transparent 0%, black 100%);
      pointer-events: none;
      z-index: 9999;
    }

    h1 {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      text-shadow: 0 0 10px black;
      z-index: 1;
    }
  </style>
</head>
<body>
  <h1>Move your mouse to reveal the light</h1>
  <div class="mask-layer"></div>

  <script>
    const maskLayer = document.querySelector('.mask-layer');

    document.addEventListener('mousemove', (e) => {
      const x = e.clientX;
      const y = e.clientY;
      maskLayer.style.maskImage = `radial-gradient(circle 100px at ${x}px ${y}px, transparent 0%, black 100%)`;
      maskLayer.style.webkitMaskImage = `radial-gradient(circle 100px at ${x}px ${y}px, transparent 0%, black 100%)`;
    });
  </script>
</body>
</html>
